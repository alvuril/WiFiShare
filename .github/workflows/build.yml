name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --windowed --name WiFiShare wifishare.py
      - name: Zip the app folder
        run: Compress-Archive -Path dist\WiFiShare\* -DestinationPath dist\WiFiShare-windows.zip
      - name: Create SHA-256 checksum
        run: |
          $hash = (Get-FileHash dist\WiFiShare-windows.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\WiFiShare-windows.zip.sha256 -Value "$hash  WiFiShare-windows.zip" -Encoding ascii
          "SHA-256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "SHA-256: $hash"
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WiFiShare-windows
          path: |
            dist/WiFiShare-windows.zip
            dist/WiFiShare-windows.zip.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WiFiShare-windows.zip
            dist/WiFiShare-windows.zip.sha256
